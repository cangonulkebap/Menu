.section-heading p {

.card {

  transition: transform .2s, border-color .2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #8b3a32;
}

/* IMAGE LOADING */
.photo {
  position: relative;
  aspect-ratio: 1.5 / 1;
  overflow: hidden;
  background: #2b2420;
}

.photo:not(.loaded):not(.error) {
  background: linear-gradient(
    110deg,
    #292320 8%,
    #40352e 18%,
    #292320 33%
  );
  background-size: 200% 100%;
  animation: skeleton 1.5s linear infinite;
}

@keyframes skeleton {
  from { background-position-x: 200%; }
  to { background-position-x: -200%; }
}

.photo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.02);
  transition:
    opacity .4s ease,
    transform .4s ease;
}

.photo.loaded img {
  opacity: 1;
  transform: scale(1);
}

.card:hover .photo.loaded img {
  transform: scale(1.05);
}

.photo.error {
  background: linear-gradient(
    135deg,
    #49352b,
    #1d1714
  );
}

.photo.error::after {
  content: "Görsel yakında";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: #d2c4ba;

/*
=======================================
IMAGE OPTIMIZATION SETTINGS
=======================================

يمكن تغيير عرض الصور من هنا.

500 مناسب لمعظم بطاقات المنيو.
600 إذا أردت دقة أعلى قليلًا.
*/

const IMAGE_WIDTH = 500;

/*
تحسين Cloudinary:
- تحديد العرض
- ضغط تلقائي
- صيغة تلقائية
- الحفاظ على الشفافية إن كانت مدعومة
*/

function optimizeImage(url) {

  if (!url || typeof url !== "string") {
    return "";
  }

  const cleanUrl = url.trim();

  // Ignore incomplete placeholder URLs.
  if (
    /^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\/(?:f_auto,q_auto\/)?\d{4}$/.test(cleanUrl)
  ) {
    return "";
  }

  // Cloudinary
  if (
    cleanUrl.startsWith("https://res.cloudinary.com/") &&
    cleanUrl.includes("/image/upload/")
  ) {

    const marker = "/image/upload/";
    const parts = cleanUrl.split(marker);
    const rest = parts.slice(1).join(marker);

    // Already optimized URLs are left unchanged.
    if (
      /(?:^|[\/,])f_auto(?:[,\/]|$)/.test(rest) ||
      /(?:^|[\/,])q_auto(?:[,\/]|$)/.test(rest)
    ) {
      return cleanUrl;
    }

    return (
      parts[0] +
      marker +
      "c_limit,w_" + IMAGE_WIDTH +
      "/f_auto/q_auto/" +
      rest
    );
  }

  // Unsplash
  if (cleanUrl.startsWith("https://images.unsplash.com/")) {

    try {
      const u = new URL(cleanUrl);

      u.searchParams.set("auto", "format");
      u.searchParams.set("fit", "crop");
      u.searchParams.set("w", String(IMAGE_WIDTH));
      u.searchParams.set("q", "75");

      return u.toString();

    } catch (error) {
      return cleanUrl;
    }
  }

  // Other image hosts
  return cleanUrl;
}

/*
=======================================
RENDER MENU
=======================================
*/

const tabs = document.getElementById("tabs");
const main = document.getElementById("main");

function makeTab(category) {

  const button = document.createElement("button");

  button.className =
    "tab" +
    (category.id === menuData[0].id ? " active" : "");

  button.type = "button";

  const emoji = document.createElement("span");
  emoji.className = "emoji";
  emoji.textContent = category.emoji;

  button.append(
    emoji,
    document.createTextNode(category.label)
  );

  button.addEventListener("click", () => {

    document.getElementById(category.id)
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    button.classList.add("active");

  });

  tabs.appendChild(button);
}

function makeSection(category) {

  const section = document.createElement("section");
  section.className = "menu-section";
  section.id = category.id;

  const heading = document.createElement("div");
  heading.className = "section-heading";

  const left = document.createElement("div");
  left.className = "heading-left";

  const icon = document.createElement("span");
  icon.className = "section-icon";
  icon.textContent = category.emoji;

  const text = document.createElement("div");

  const title = document.createElement("h2");
  title.textContent = category.label;

  const subtitle = document.createElement("p");
  subtitle.textContent = "Özenle seçilmiş lezzetler...";

  text.append(title, subtitle);
  left.append(icon, text);

  const count = document.createElement("span");
  count.className = "count-pill";
  count.textContent = category.items.length + " Ürün ›";

  heading.append(left, count);
  section.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "grid";

  category.items.forEach((item, itemIndex) => {

    const card = document.createElement("article");
    card.className = "card";

    /* IMAGE */
    const photo = document.createElement("div");
    photo.className = "photo";

    const img = document.createElement("img");

    img.alt = item.name;
    img.decoding = "async";

    /*
    Give priority to the first two images only.
    Other images are lazy-loaded.
    */
    const isPriority =
      category.id === menuData[0].id &&
      itemIndex < 2;

    img.loading = isPriority ? "eager" : "lazy";

    if (isPriority && itemIndex === 0) {
      img.fetchPriority = "high";
    } else {
      img.fetchPriority = "auto";
    }

    /*
    Let browser select the image size
    from CSS layout. Width/height here
    are for intrinsic aspect ratio hints.
    */
    img.width = 500;
    img.height = 333;

    img.onload = () => {
      photo.classList.add("loaded");
    };

    img.onerror = () => {
      photo.classList.add("error");
      img.style.display = "none";
    };

    const imageUrl = optimizeImage(item.image);

    if (imageUrl) {
      img.src = imageUrl;
      photo.appendChild(img);

      if (img.complete && img.naturalWidth > 0) {
        photo.classList.add("loaded");
      }
    } else {
      photo.classList.add("error");
    }

    /* DETAILS */
    const details = document.createElement("div");
    details.className = "details";

    const productTitle = document.createElement("h3");
    productTitle.textContent = item.name;

    const description = document.createElement("p");
    description.className = "desc";

    if (item.doublePrice != null) {
      description.textContent = "Tek Porsiyon / Duble";
    } else {
      description.style.display = "none";
    }

    /* PRICE */
    const row = document.createElement("div");
    row.className = "price-row";

    const price = document.createElement("span");
    price.className = "price";
    price.textContent =
      item.price.toLocaleString("tr-TR") + " TL";

    const heart = document.createElement("span");
    heart.className = "heart-mark";
    heart.textContent = "♥";

    row.append(price, heart);

    /* DOUBLE PRICE */
    if (item.doublePrice != null) {

      const doublePrice = document.createElement("span");
      doublePrice.className = "price price-double";

      doublePrice.textContent =
        "Duble " +
        item.doublePrice.toLocaleString("tr-TR") +
        " TL";

      row.appendChild(doublePrice);
    }

    details.append(productTitle, description, row);
    card.append(photo, details);
    grid.appendChild(card);

  });

  section.appendChild(grid);
  main.appendChild(section);
}

/* BUILD MENU */
menuData.forEach(category => {
  makeTab(category);
  makeSection(category);
});

/* ACTIVE CATEGORY */
const allTabs = [...document.querySelectorAll(".tab")];

if ("IntersectionObserver" in window) {

  const observer = new IntersectionObserver(entries => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {

        const index = menuData.findIndex(
          category => category.id === entry.target.id
        );

        allTabs.forEach((tab, i) => {
          tab.classList.toggle("active", index === i);
        });

      }

    });

  }, {
    rootMargin: "-25% 0px -60% 0px"
  });

  menuData.forEach(category => {
    observer.observe(
      document.getElementById(category.id)
    );
  });

}

</script>
